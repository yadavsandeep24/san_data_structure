<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Data Structures &amp; Algorithms for Mobile Developers — Kotlin, Swift, Dart, TypeScript" />
    <title>DSA for Mobile Developers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <style>
      :root {
        --theme-color: #2563eb;
      }
      .markdown-section pre {
        font-size: 0.85em;
      }
      @media (max-width: 768px) {
        .markdown-section {
          padding: 1rem;
        }
        .markdown-section pre {
          font-size: 0.75em;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script>
      // Works on github.io/<repo>/ without hardcoding the repo name
      (function () {
        var parts = location.pathname.split("/").filter(Boolean);
        var basePath = parts.length ? "/" + parts[0] + "/" : "/";

        window.$docsify = {
          name: "DSA for Mobile",
          homepage: "README.md",
          loadSidebar: true,
          subMaxLevel: 3,
          relativePath: true,
          basePath: basePath,
          auto2heading: true,
          maxLevel: 4,
          search: {
            placeholder: "Search chapters…",
            noData: "No matches",
            depth: 4,
          },
          pagination: {
            previousText: "← Previous",
            nextText: "Next →",
            crossChapter: true,
          },
        };
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-kotlin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-swift.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-dart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  </body>
</html>
